<style>
  :root{
    --bg:#12141a;

    margin:0 0 4px;

    width:100%;
    height:10px;
    background:#2a2e3a;
    border-radius:6px;
    overflow:hidden;
    margin-bottom:24px;
  }
  .bar-fill{
    height:100%;
    background:var(--accent);
    transition:width .25s ease;
  }
  .card{
    background:var(--card);
    border-radius:14px;
    padding:28px 24px;
    box-shadow:0 6px 24px rgba(0,0,0,.35);
  }
  .tag{
    display:inline-block;
    font-family:Arial,sans-serif;
    font-size:.85rem;
    color:var(--accent);
    background:rgba(90,169,255,.12);
    padding:4px 10px;
    border-radius:20px;
    margin-bottom:14px;
  }
  .question{
    font-size:1.35rem;
    margin-bottom:22px;
    font-weight:bold;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .opt{
    text-align:left;
    background:#252936;
    border:2px solid #333a4a;
    color:var(--text);
    font-family:inherit;
    font-size:1.15rem;
    padding:16px 18px;
    border-radius:10px;
    cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .opt:hover:not(:disabled){
    border-color:var(--accent);
  }
  .opt:disabled{
    cursor:default;
  }
  .opt.correct{
    background:rgba(62,207,110,.18);
    border-color:var(--ok);
  }
  .opt.wrong{
    background:rgba(255,90,90,.18);
    border-color:var(--bad);
  }
  .feedback{
    margin-top:18px;
    font-size:1.1rem;
    font-family:Arial,sans-serif;
  }
  .feedback.ok{color:var(--ok);}
  .feedback.bad{color:var(--bad);}
  .next-btn{
    margin-top:22px;
    width:100%;
    padding:16px;
    font-size:1.2rem;
    font-family:Arial,sans-serif;
    font-weight:bold;
    background:var(--accent);
    color:#0a0c10;
    border:none;
    border-radius:10px;
    cursor:pointer;
  }
  .next-btn:active{opacity:.85;}
  .start-btn{
    display:block;
    margin:24px auto 0;
    padding:18px 34px;
    font-size:1.25rem;
    font-family:Arial,sans-serif;
    font-weight:bold;
    background:var(--accent);
    color:#0a0c10;
    border:none;
    border-radius:12px;
    cursor:pointer;
  }
  .center{text-align:center;}
  .stats{
    font-family:Arial,sans-serif;
    font-size:1.1rem;
    color:var(--muted);
    text-align:center;
    margin-top:10px;
  }
  .mode-banner{
    text-align:center;
    font-family:Arial,sans-serif;
    font-size:1rem;
    color:#ffcf5a;
    background:rgba(255,207,90,.1);
    border:1px solid rgba(255,207,90,.3);
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:20px;
  }
  .final-score{
    font-size:2rem;
    text-align:center;
    margin:20px 0;
    font-family:Arial,sans-serif;
    font-weight:bold;
  }
  .review-list{
    text-align:left;
    font-family:Arial,sans-serif;
    font-size:1rem;
    color:var(--muted);
    margin-top:20px;
  }
  .review-list li{margin-bottom:8px;}
  .reset-link{
    text-align:right;
    font-family:Arial,sans-serif;
    font-size:.9rem;
    color:var(--muted);
    text-decoration:underline;
    cursor:pointer;
    margin-bottom:14px;
  }
</style>

{t:"Lez. 036",q:"Alcuni tra gli esponenti principali del Dolce Stil Novo furono:",o:["Guido Guinizzelli e Guido Cavalcanti","Guittone d'Arezzo e Jacopo da Lentini","Federico II e Francesco Petrarca","Manfredi di Svevia e Pier della Vigna"]},
{t:"Lez. 036",q:"Il termine Dolce Stil Novo fu coniato per la prima volta:",o:["Da Dante nella \"Divina Commedia\"","Da Dante nel \"Convivio\"","Da Dante nel \"De Vulgari Eloquentia\"","Da Dante nella \"Vita Nova\""]},
{t:"Lez. 036",q:"L'intento di Dante nello scrivere il De Vulgari Eloquentia era quello di:",o:["dimostrare che il volgare poteva ascendere al rango di lingua letteraria","dimostrare il primato del volgare fiorentino su qualsiasi altra lingua","dimostrare il primato del latino su qualsiasi altra lingua","dimostrare il primato del volgare illustre della Scuola Siciliana e Toscana su qualsiasi altra lingua"]},
{t:"Lez. 036",q:"Francesco Petrarca:",o:["era un fermo sostenitore del latino come lingua della cultura.","considerava il \"Canzoniere\" la sua opera maestra.","difese strenuamente l'uso del volgare come lingua della cultura.","era d'accordo con la teoria dantesca della necessità di una lingua nazionale identificata con un volgare illustre."]},
{t:"Lez. 036",q:"Il De Vulgari Eloquentia:",o:["rimase praticamente sconosciuto, fino alla prima metà del 1500.","divenne presto un punto di riferimento per tutti i poeti trecenteschi.","fu ultimato da Dante, dopo che egli ebbe terminato la stesura della Divina Commedia.","è un'opera suddivisa in quattro libri."]},
{t:"Lez. 036",q:"La canzone \"Donne ch'avete intelletto d'amore\" è un esempio:",o:["di poesia stilnovista","di poesia guittoniana","di poesia della scuola toscana","di poesia della scuola siciliana"]},
{t:"Lez. 036",q:"Quale canzone viene citata da Dante nella Divina Commedia come esempio di poesia stilnovista?",o:["\"Donne ch'avete intelletto d'amore\", scritta dallo stesso Dante","\"Al cor gentil rempaira sempre amore\", scritta da Guido Guinizzelli","\"Ahi lasso, or è stagion de doler tanto\", scritta da Guittone d'Arezzo","\"Vergine bella, che di sol vestita\", scritta da Francesco Petrarca"]},
{t:"Lez. 036",q:"Chi sono i poeti conosciuti come le \"Tre Corone\"?",o:["Dante Alighieri, Francesco Petrarca e Boccaccio","Guittone d'Arezzo, Bonagiunta Orbicciani e Guido Guinizzelli","nessuna delle risposte è corretta","Manfredi di Svevia, Pier della Vigna e Jacopo da Lentini"]},
{t:"Lez. 036",q:"Il termine \"occitano\" fu coniato per la prima volta:",o:["Da Dante nel De Vulgari Eloquentia","Da Dante nella Vita Nova","Da Dante nella Divina Commedia","Da Dante nel Convivio"]},
{t:"Lez. 036",q:"Petrarca vedeva la sua produzione in volgare:",o:["come una passione personale e privata, da non divulgare al pubblico","come un esempio della sua teoria sulla necessità di un volgare nazionale","come nettamente superiore alla sua produzione in latino","come un esempio significativo della sua teoria linguistica"]},
{t:"Lez. 036",q:"Nel contesto della \"questione della lingua\" cinquecentesca, i sostenitori del fiorentino trecentesco:",o:["arrivarono a dubitare l'autenticità del De Vulgari Eloquentia.","condannarono la teoria dantesca della necessità di una lingua nazionale che tragga origine da un volgare illustre.","condannarono la teoria petrarchesca della necessità di una lingua nazionale che tragga origine da un volgare illustre.","usarono il \"De Vulgari Eloquentia\" per corroborare la loro teoria."]},
{t:"Lez. 036",q:"La canzone \"Vergine bella, che di sol vestita\":",o:["contiene dei latinismi","contiene degli esempi di volgare siciliano","contiene degli esempi di volgare bolognese","contiene dei provenzalismi"]},
{t:"Lez. 036",q:"Il \"Ritmo Laurenziano\" (\"Salva lo vescovo senato\")",o:["fu composto da un giullare","è un esempio di poesia stilnovistica","fu composto da un nobile","fu composto da un membro della classe ecclesiastica"]},
{t:"Lez. 036",q:"Il \"Conto navale pisano\"",o:["è una delle prime testimonianze di documenti interamente scritti in volgare.","è un esempio di volgare illustre","è scritto in latino, e contiene delle attestazioni di volgare","è stato prodotto da degli esponenti dell'elite intellettuale toscana"]},
{t:"Lez. 036",q:"La canzone \"Vergine bella, che di sol vestita\", è un esempio:",o:["della varietà illustre di volgare fiorentino usata da Petrarca","di poesia stilnovista","di poesia della scuola toscana","di poesia della scuola siciliana"]},
{t:"Lez. 036",q:"La \"Divina Commedia\":",o:["ebbe immediata fortuna sia in Toscana, sia in altre regioni italiane","era rivolta solo alla popolazione più colta","ebbe poca fortuna nel Trecento, e fu riscoperta nel Cinquecento","era intelligibile solo alla popolazione più colta"]},
{t:"Lez. 036",q:"Il documento relativo alla Postilla Amiatina:",o:["è stato scritto prevalentemente in latino, e contiene una breve attestazione di volgare toscano","è stato scritto prevalentemente in volgare toscano, e contiene dei latinismi","è stato scritto esclusivamente in volgare toscano","è stato scritto esclusivamente in latino"]},

{t:"Lez. 044",q:"Il Certame Coronario indetto da Piero de' Medici nel 1441:",o:["Fu concluso in anticipo a causa di un disaccordo legato alla lingua usata dai poeti, e la vittoria non venne assegnata a nessun artista","Fu un'idea di Poggio Bracciolini","Terminò con il riconoscimento del volgare fiorentino quattrocentesco come lingua superiore nella letteratura.","Terminò con la vittoria di Leon Battista Alberti"]},
{t:"Lez. 044",q:"Uno tra i letterati di maggiore levatura che utilizzarono la lingua cortigiana napoletana nei propri componimenti, fu:",o:["Jacopo Sannazzaro","Luigi Pulci","Baldassarre Castiglione","Mario Equicola"]},
{t:"Lez. 044",q:"Il modello linguistico promosso da Bembo per la prosa:",o:["era la varietà linguistica utilizzata da Boccaccio nel Proemio del \"Decameron\"","era la varietà linguistica utilizzata da Boccaccio nel \"Decameron\" per narrare le novelle ad argomento comico","era ben diversa dalla varietà linguistica utilizzata negli \"Asolani\"","era la stessa varietà linguistica promossa da Dante nel \"De Vulgari eloquentia\""]},
{t:"Lez. 044",q:"Dopo l'introduzione della stampa a caratteri mobili, i principali centri di produzione editoriale erano:",o:["Roma e Venezia","Firenze e Urbino","Genova e Bologna","Napoli e Milano"]},
{t:"Lez. 044",q:"Che lingua adottò Machiavelli per scrivere il \"Discorso intorno alla nostra lingua\"?",o:["Il \"fiorentino vivo\"","Il fiorentino aureo","nessuna delle risposte è corretta","Il fiorentino argenteo"]},
{t:"Lez. 044",q:"Machiavelli, nel \"Discorso intorno alla nostra lingua\":",o:["critica duramente la posizione di Dante circa il volgare toscano","vuole promuovere l'uso del fiorentino trecentesco adottato da Petrarca","afferma di essere d'accordo con la posizione di Dante circa il volgare toscano","vuole promuovere l'uso del fiorentino trecentesco adottato da Boccaccio"]},
{t:"Lez. 044",q:"La stampa a caratteri mobili fu importata in Italia:",o:["Grazie all'intervento di Niccolò Cusano","Grazie all'intervento di Piero de' Medici","Solo all'inizio del Cinquecento","Grazie all'intervento di Leon Battista Alberti"]},
{t:"Lez. 044",q:"La teoria linguistica di Machiavelli:",o:["non fa distinzione tra lingua scritta e lingua parlata","coincide con quella di Bembo","coincide con quella esposta da Dante nel \"De Vulgari Eloquentia\"","fa una marcata distinzione tra lingua scritta e lingua parlata"]},
{t:"Lez. 044",q:"Bembo, nelle \"Prose della Volgar lingua\"",o:["cita dei passi della \"Divina Commedia\" per criticare lo stile \"basso\" adottato a volte da Dante","sostiene che lo stile di Petrarca sia inadatto per la poesia","cita dei passi della \"Divina Commedia\" per spiegare il perché ha scelto Dante come modello per la poesia","sostiene una tesi simile a quella teorizzata da Machiavelli"]},
{t:"Lez. 044",q:"Leon Battista Alberti, nella Grammatichetta Vaticana:",o:["Fornisce degli schemi esplicativi per illustrare i vari aspetti della lingua che intende promuovere.","Critica aspramente il volgare fiorentino","Inserisce le spiegazioni di tipo grammaticale all'interno di un dialogo immaginario tra vari personaggi ispirati a personalità storiche realmente esistite","Fornisce degli esempi tratti da testi letterari."]},
{t:"Lez. 044",q:"Leon Battista Alberti:",o:["Pubblicò alcune delle sue opere maggiori come il \"De Pictura\" sia nella versione in latino, sia nella versione in volgare","Fu d'accordo con le decisioni prese dai giudici nel contesto del Certame coronario","Sosteneva la superiorità del latino sul volgare fiorentino","Pubblicò le sue opere esclusivamente in volgare fiorentino Quattrocentesco"]},
{t:"Lez. 044",q:"Il modello linguistico promosso da Bembo per la poesia:",o:["era la lingua utilizzata da Petrarca nel \"Canzoniere\"","era la lingua utilizzata da Dante nella \"Vita Nova\"","era la lingua utilizzata da Dante nel \"Convivio\"","era la lingua utilizzata da Dante nella \"Divina Commedia\""]},
{t:"Lez. 044",q:"Nell'esporre la sua teoria sulla natura della lingua latina, Flavio Biondo arrivò a:",o:["Esporre la prima teoria relativa al passaggio dalla lingua latina alle lingue volgari romanze","Negare alcun tipo di continuazione tra il latino e le lingue volgari romanze","Teorizzare una netta divisione tra il latino parlato ed il latino utilizzato in ambito letterario","Legare l'utilizzo di quello che oggi definiamo come \"latino classico\" ad un gruppo ristretto di parlanti"]},
{t:"Lez. 044",q:"Le \"Prose della volgar lingua\":",o:["Sono state strutturate come un dialogo di stampo platonico","Hanno come scopo quello di promuovere l'uso del volgare fiorentino cinquecentesco","Sono una grammatica pratica del fiorentino quattrocentesco","Contengono degli schemi esplicativi per illustrare la varietà di volgare che promuovono"]},
{t:"Lez. 044",q:"Baldassarre Castiglione, nel contesto della \"Questione della lingua\"",o:["Prese le parti della teoria cortigiana","Sosteneva il primato del fiorentino quattrocentesco","Sosteneva il primato del fiorentino trecentesco","Era d'accordo con la teoria di Pietro Bembo"]},
{t:"Lez. 044",q:"Uno dei più accesi dibattiti Quattrocenteschi sulla lingua latina fu la dialettica tra:",o:["Leonardo Bruni e Flavio Biondo","Francesco Petrarca e Dante Alighieri","Pietro Bembo e Gian Giorgio Trìssino","Niccolò Machiavelli e Pietro Bembo"]},
{t:"Lez. 044",q:"Nel corso della \"Questione della lingua\" Cinquecentesca, quale fu l'aspetto più criticato delle lingue cortigiane?",o:["L'elevata artificialità del processo che portava alla loro creazione","Il fatto che esse erano essenzialmente identificabili con la lingua parlata del tempo","Il fatto che le lingue cortigiane erano troppo simili al latino","Il fatto che le lingue cortigiane erano prevalentemente legate all'ambiente delle cancellerie statali, e quindi erano poco adatte a diventare lingua letteraria"]},
{t:"Lez. 044",q:"Grazie alla collaborazione tra Aldo Manuzio e Pietro Bembo, vennero pubblicate all'inizio del Cinquecento delle edizioni stampate:",o:["Della \"Divina Commedia\" di Dante Alighieri e del \"Canzoniere\" di Francesco Petrarca","Del \"Decameron\" di Giovanni Boccaccio","Del \"Cortigiano\" di Baldassarre Castiglione","Del \"Morgante\" di Luigi Pulci"]},
{t:"Lez. 044",q:"Tra queste fu una delle più importanti invenzioni di Aldo Manuzio:",o:["Il carattere corsivo","Gli incunabola","Il carattere gotico","La stampa a caratteri mobili"]},
{t:"Lez. 044",q:"Nella sua \"Grammatichetta\", Leon Battista Alberti tenta per la prima volta di codificare:",o:["Il volgare fiorentino quattrocentesco","Il volgare fiorentino trecentesco","Il volgare proprio della sua città di nascita: Genova","Il volgare proprio della città dove abitò per la maggior parte della sua vita: Roma"]},

{t:"Lez. 052",q:"L'\"Epistola de le lettere nuovamente aggiunte ne la lingua italiana\" di Gian Giorgio Trìssino:",o:["proponeva di aggiungere all'alfabeto latino alcune lettere greche per ovviare ai principali casi di non corrispondenza tra grafia e pronuncia.","proponeva di sostituire all'alfabeto latino le lettere dell'alfabeto greco, per ovviare ai principali casi di non corrispondenza tra grafia e pronuncia.","proponeva di creare un nuovo alfabeto \"ex novo\" per sostituirlo all'alfabeto latino ed allontanare così il più possibile la lingua cortigiana dal latino","proponeva di sostituire all'alfabeto latino le lettere dell'alfabeto greco, per allontanare il più possibile la lingua cortigiana dal latino"]},
{t:"Lez. 052",q:"L'Accademia degli Umidi:",o:["fu fondata prima dell'Accademia della Crusca","fu fondata da Benedetto Varchi","era fortemente disapprovata da Cosimo I de' Medici","era fortemente avversa al fiorentino trecentesco come lingua letteraria"]},
{t:"Lez. 052",q:"Gian Giorgio Trìssino:",o:["Era un fermo oppositore della teoria della superiorità del fiorentino trecentesco rispetto alla lingua cortigiana","Criticò duramente il \"De Vulgari Eloquentia\" di Dante","Elaborò una teoria linguistica che ancora oggi è alla base dell'ideologia dell'Accademia della Crusca","Concordava con la teoria linguistica di Pietro Bembo"]},
{t:"Lez. 052",q:"La commedia \"Bilóra\"",o:["è un esempio di \"letteratura dialettale riflessa\"","è priva di dialettismi e linguaggio scurrile","seguiva gli standard lessicali stabiliti dall'\"Accademia della Crusca\"","fu composta interamente in italiano"]},
{t:"Lez. 052",q:"Il padovano Angelo Beolco, detto Ruzante:",o:["Fece parte dell'\"Accademia degli Infiammati\"","Fece parte dell'\"Accademia della Crusca\"","Fece parte dell'\"Accademia degli Umidi\"","Scriveva in fiorentino cinquecentesco"]},
{t:"Lez. 052",q:"Giovan Battista Basile:",o:["Scrisse una raccolta di fiabe in dialetto napoletano, tra cui troviamo Cenerentola","Pubblicò la sua raccolta di fiabe quando ancora era in vita","Scrisse una raccolta di fiabe in dialetto fiorentino","Scrisse una raccolta di fiabe in dialetto napoletano, che fu aspramente criticata dai fratelli Grimm"]},
{t:"Lez. 052",q:"L'umanista Benedetto Varchi:",o:["entrò a far parte dell'\"Accademia Fiorentina\"","Nell'\"Ercolano\", espose una teoria linguistica radicalmente differente da quella di Machiavelli","entrò a far parte dell'\"Accademia della Crusca\"","Concordava pienamente con la concezione linguistica di Gian Giorgio Trìssino"]},
{t:"Lez. 052",q:"Nel corso del Settecento:",o:["Vennero coniati nuovi tecnicismi, prevalentemente legati alle arti, alle scienze e al mondo industriale","L'\"Accademia della Crusca\" si dissolse","In ambito giuridico, si utilizzava esclusivamente il latino","L'italiano ancora non veniva insegnato nelle scuole"]},
{t:"Lez. 052",q:"Dopo il Concilio di Trento:",o:["La Chiesa Cattolica decise di vietare la traduzione delle Sacre Scritture","La Chiesa Cattolica decise di ricorrere esclusivamente al latino per i sermoni","La Chiesa Cattolica decise di ricorrere esclusivamente al fiorentino trecentesco per i sermoni","La Chiesa Cattolica decise di consentire la traduzione delle Sacre Scritture"]},
{t:"Lez. 052",q:"Melchiorre Cesarotti:",o:["Gettò le basi per la moderna teoria legata alle variabili sociolinguistiche","Era un fermo oppositore della teoria legata alle variabili sociolinguistiche","non concordava con l'inclusione di tecnicismi di coniazione settecentesca, all'interno dei vocabolari.","Era un fermo oppositore delle idee illuministe"]},
{t:"Lez. 052",q:"Il membro dell'\"Accademia degli Umidi\" Pier Francesco Giambullari:",o:["Fu il primo fiorentino a scrivere e pubblicare una Grammatica della lingua fiorentina","Rigettava completamente la teoria linguistica del \"fiorentino vivo\"","Venne espulso dall'\"Accademia Fiorentina\" perché non simpatizzava con le idee politiche di Cosimo I de' Medici","Venne espulso dall'\"Accademia Fiorentina\" in seguito ad un alterco con Antonio Francesco Grazzini (detto il \"Lasca\")"]},
{t:"Lez. 052",q:"L'intellettuale settecentesco Alessandro Verri:",o:["espresse pubblicamente il suo dissenso sulle scelte operate dall'Accademia della Crusca in merito alla pubblicazione della quarta edizione del Vocabolario","era un fermo sostenitore del classicismo letterario","non concordava con l'inclusione di tecnicismi di coniazione settecentesca, all'interno dei vocabolari.","concordava appieno con le scelte operate dall'Accademia della Crusca in merito alla pubblicazione della quarta edizione del Vocabolario"]},
{t:"Lez. 052",q:"Il periodico \"Il Caffè\":",o:["era prevalentemente indirizzato ad un pubblico colto","era una pubblicazione che si occupava prevalentemente di riportare notizie di attualità","è un giornale ancora pubblicato a Milano","era un giornale dagli ideali filo-austriaci"]},
{t:"Lez. 052",q:"L'Accademia della Crusca:",o:["fu fondata da un gruppo di intellettuali fiorentini come un circolo intellettuale di stampo goliardico, dove discutere di temi linguistici","fu fondata prima dell'\"Accademia degli Umidi\"","fu fondata con lo specifico scopo di contrapporsi ideologicamente all'\"Accademia degli Infiammati\" di Padova","fu fondata da un gruppo di intellettuali fiorentini che avversavano categoricamente la teoria linguistica di Pietro Bembo"]},
{t:"Lez. 052",q:"Il vocabolario dell'Accademia della Crusca:",o:["Includeva sia termini propri del fiorentino Trecentesco, sia termini propri del fiorentino argenteo","Escludeva termini tratti da opere scritte da autori non fiorentini","Includeva unicamente termini propri del fiorentino argenteo","Includeva unicamente termini propri del fiorentino Trecentesco"]},
{t:"Lez. 052",q:"Pietro Verri:",o:["Pubblicò un articolo sul \"Caffé\" dove criticava lo stile ironico che Parini utilizzava nel \"Giorno\"","Era fortemente contrario alle idee illuministe propugnate dagli autori degli articoli pubblicati nel \"Caffè\"","Non concordava con l'ideologia illuminista propria dell'\"Accademia dei Pugni\".","Pubblicò un articolo sul \"Caffé\" dove elogiava lo stile ironico che Parini utilizzava nel \"Giorno\""]},
{t:"Lez. 052",q:"Lo \"stile spezzato\", conosciuto anche come style coupé:",o:["veniva spesso utilizzato nel contesto degli articoli pubblicati nei periodici settecenteschi","Seguiva prevalentemente la struttura sintattico SOV","coincideva con la sintassi propria della prosa letteraria boccaccesca","Prevedeva frequenti inversioni sintattiche"]},
{t:"Lez. 052",q:"Nella seconda metà del Settecento:",o:["L'italiano divenne materia di insegnamento nelle scuole","Nel contesto delle spiegazioni relative alle lezioni universitarie, si utilizzava unicamente il latino","I fanciulli non avevano ancora accesso a grammatiche specificamente pensate per l'insegnamento scolastico della lingua italiana.","L'italiano ancora non era materia di insegnamento nelle scuole"]},
{t:"Lez. 052",q:"La diffusione dell'italiano normato dalle grammatiche cinquecentesche e dai primi vocabolari:",o:["In una prima fase, riguardò esclusivamente le classi colte","Avvenne rapidamente, nel corso del XVI secolo","Avvenne rapidamente, anche presso le classi meno colte","Fu ostacolata dalla Chiesa"]},
{t:"Lez. 052",q:"La seconda edizione del Vocabolario dell'Accademia della Crusca:",o:["È il risultato di una ricerca lessicografica ancora più estesa dell'edizione precedente","Subì un cambiamento radicale rispetto alla prima edizione","Fu elaborata, ma non venne mai pubblicata","Non si fondava più sulla teoria elaborata da Pietro Bembo"]},

{t:"Lez. 059",q:"La \"Legge Casati\", promulgata in Piemonte nel 1859 ed estesa nel 1861 a tutto il territorio nazionale:",o:["prevedeva due anni di istruzione elementare gratuiti per tutti i cittadini","prevedeva un sistema nazionale di scuola dell'obbligo","prevedeva una retta scolastica agevolata per i cittadini meno abbienti","prevedeva la gratuità dell'intero percorso scolastico"]},
{t:"Lez. 059",q:"Tra i fattori che contribuirono di più alla diffusione dell'italiano all'indomani dell'Unità d'Italia NON troviamo:",o:["l'imposizione da parte del governo di usare la lingua nazionale in ogni contesto","le migrazioni interne ed esterne","la burocrazia statale","la scuola e le riforme scolastiche"]},
{t:"Lez. 059",q:"Il linguaggio tipico delle \"commedie all'italiana\":",o:["poteva includere dialettismi ed espressioni colloquiali","era un italiano molto vicino a quello letterario","coincideva con l'italiano usato abitualmente dall'èlite colta del periodo","era un italiano molto simile a quello insegnato a scuola"]},
{t:"Lez. 059",q:"L'ambiente culturale in cui crebbe Alessandro Manzoni:",o:["Era fortemente influenzato dalla corrente illuminista","Era fortemente conservatore e chiuso a qualunque innovazione, anche in campo linguistico","Era fortemente influenzato dalla cultura positivista tedesca","Era caratterizzato da un ostinato attaccamento ai canoni linguistici dettati dall'\"Accademia della Crusca\""]},
{t:"Lez. 059",q:"A quale lingua Manzoni paragona l'italiano per individuare i problemi relativi alla \"questione della lingua\" nell'Ottocento?",o:["il francese","il tedesco","l'inglese","il latino"]},
{t:"Lez. 059",q:"La lingua utilizzata da Manzoni per la stesura definitiva dei \"Promessi Sposi\":",o:["coincideva con il \"fiorentino vivo\", ovvero una lingua coeva parlata dalla classe colta fiorentina.","coincideva con una commistione di toscano e lombardo, con l'aggiunta di francesismi e latinismi.","coincideva con il fiorentino trecentesco.","coincideva con la lingua italiana che fino a quel momento era stata codificata nei dizionari e nelle grammatiche."]},
{t:"Lez. 059",q:"Qual era il titolo della prima, rudimentale versione dei \"Promessi Sposi\"?",o:["\"Fermo e Lucia\"","\"Gli Sposi Promessi\"","\"I Promessi Sposi\"","\"Renzo e Lucia\""]},
{t:"Lez. 059",q:"La \"Riforma Gentile\", promulgata nel 1923:",o:["prevedeva un sistema di sanzioni pecuniarie in caso di mancato rispetto della scuola dell'obbligo","prevedeva un sistema scolastico completamente diverso da quello attuale","non prevedeva la scuola dell'obbligo","prevedeva la scuola dell'obbligo fino all'ultimo anno delle superiori"]},
{t:"Lez. 059",q:"In seguito all'unità d'Italia:",o:["tutti gli impiegati degli uffici pubblici dovettero utilizzare l'italiano come lingua ufficiale nel contesto lavorativo","il governo permise ai burocrati di continuare ad utilizzare il dialetto","solamente i cittadini alfabetizzati vennero ammessi nei ranghi dell'esercito","il governo obbligò per legge tutta la popolazione a comunicare in italiano"]},

// ---- Motore quiz ----
let queue = [];      // domande della sessione corrente (ordine casuale)
let wrongPool = [];  // domande sbagliate da ripetere alla fine
let current = null;
let mode = "main";   // "main" | "review"
let totalMain = 0;
let answeredMain = 0;
let correctMain = 0;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildOptions(q){
  const opts = q.o.map((text,idx)=>({text, correct: idx===0, orig: idx}));
  return shuffle(opts);
}

// ---- Salvataggio locale (resiste a chiusura/riapertura del browser) ----
const STORAGE_KEY = "paniereLinguisticaQuizState_v1";

function saveState(screen){
  const state = {
    screen, mode,
    queueIdx: queue.map(q=>QUESTIONS.indexOf(q)),
    wrongPoolIdx: wrongPool.map(q=>QUESTIONS.indexOf(q)),
    currentIdx: current ? QUESTIONS.indexOf(current) : null,
    currentShuffledOrder: (screen==="question" && current) ? current._shuffled.map(o=>o.orig) : null,
    totalMain, answeredMain, correctMain
  };
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function resetAll(){
  if(confirm("Ricominciare da capo? Il progresso attuale andrà perso.")){
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    startMain();
  }
}

function startMain(){
  queue = shuffle(QUESTIONS);
  wrongPool = [];
  totalMain = queue.length;
  answeredMain = 0;
  correctMain = 0;
  mode = "main";
  next();
}

function startReview(){
  queue = shuffle(wrongPool);
  wrongPool = [];
  mode = "review";
  next();
}

function next(){
  if(queue.length === 0){
    if(mode === "main" && wrongPool.length > 0){
      saveState("reviewIntro");
      renderReviewIntro();
    } else {
      saveState("end");
      renderEnd();
    }
    return;
  }
  current = queue.shift();
  current._shuffled = buildOptions(current);
  saveState("question");
  render();
}

function render(){
  const app = document.getElementById('app');
  const total = mode === "main" ? totalMain : (answeredMain);
  const doneCount = mode === "main" ? answeredMain : null;

  let progressHtml = "";
  if(mode === "main"){
    const pct = Math.round((answeredMain/totalMain)*100);
    progressHtml = `
      <div class="progress"><span>Domanda ${answeredMain+1} / ${totalMain}</span><span>${correctMain} corrette</span></div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
    `;
  } else {
    progressHtml = `<div class="mode-banner">Ripasso finale — ${queue.length+1} domande sbagliate rimaste</div>`;
  }
  progressHtml += `<div class="reset-link" id="reset-link">Ricomincia da capo</div>`;

  const optsHtml = current._shuffled.map((o,i)=>`
    <button class="opt" data-i="${i}">${o.text}</button>
  `).join("");

  app.innerHTML = `
    ${progressHtml}
    <div class="card">
      <span class="tag">${current.t}</span>
      <div class="question">${current.q}</div>
      <div class="options">${optsHtml}</div>
      <div id="feedback"></div>
    </div>
  `;

  const buttons = app.querySelectorAll('.opt');
  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>handleAnswer(btn, buttons));
  });
  document.getElementById('reset-link').addEventListener('click', resetAll);
}

function handleAnswer(btn, buttons){
  const i = parseInt(btn.dataset.i, 10);
  const chosen = current._shuffled[i];
  const isCorrect = chosen.correct;

  buttons.forEach((b,idx)=>{
    b.disabled = true;
    if(current._shuffled[idx].correct) b.classList.add('correct');
  });
  if(!isCorrect) btn.classList.add('wrong');

  if(mode === "main"){
    answeredMain++;
    if(isCorrect){ correctMain++; }
    else { wrongPool.push(current); }
  }

  const fb = document.getElementById('feedback');
  fb.className = "feedback " + (isCorrect ? "ok" : "bad");
  fb.textContent = isCorrect ? "✓ Esatto." : "✗ Sbagliato — questa domanda tornerà nel ripasso finale.";

  const app = document.getElementById('app');
  const nextBtn = document.createElement('button');
  nextBtn.className = "next-btn";
  nextBtn.textContent = (mode==="main" && queue.length===0) ? "Continua" : "Prossima domanda";
  nextBtn.addEventListener('click', next);
  app.querySelector('.card').appendChild(nextBtn);
}

function renderReviewIntro(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card center">
      <div class="question" style="font-weight:normal;">
        Hai completato il giro principale.<br>
        Risposte corrette: ${correctMain} / ${totalMain}.
      </div>
      <div class="mode-banner">Ora si ripetono le ${wrongPool.length} domande sbagliate, in ordine casuale.</div>
      <button class="start-btn" id="go-review">Inizia il ripasso</button>
    </div>
  `;
  document.getElementById('go-review').addEventListener('click', startReview);
}

function renderEnd(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card center">
      <div class="final-score">Quiz completato ✓</div>
      <div class="stats">Punteggio primo giro: ${correctMain} / ${totalMain}</div>
      <div class="stats">Tutte le domande sbagliate sono state ripassate correttamente.</div>
      <button class="start-btn" id="restart">Ricomincia da capo</button>
    </div>
  `;
  document.getElementById('restart').addEventListener('click', startMain);
}

function renderStart(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card center">
      <div class="question" style="font-weight:normal;">
        ${QUESTIONS.length} domande a risposta chiusa dal paniere di Linguistica Italiana.<br>
        Ordine casuale ad ogni sessione. Le risposte sbagliate vengono segnalate e ripetute in fondo, finché non vengono date correttamente.
      </div>
      <button class="start-btn" id="go-start">Inizia il quiz</button>
    </div>
  `;
  document.getElementById('go-start').addEventListener('click', startMain);
}

function init(){
  const saved = loadState();
  if(!saved){ renderStart(); return; }
  mode = saved.mode;
  totalMain = saved.totalMain;
  answeredMain = saved.answeredMain;
  correctMain = saved.correctMain;
  queue = saved.queueIdx.map(i=>QUESTIONS[i]);
  wrongPool = saved.wrongPoolIdx.map(i=>QUESTIONS[i]);
  if(saved.screen === "question" && saved.currentIdx !== null){
    const q = QUESTIONS[saved.currentIdx];
    current = q;
    current._shuffled = saved.currentShuffledOrder.map(origIdx=>({text:q.o[origIdx], correct:origIdx===0, orig:origIdx}));
    render();
  } else if(saved.screen === "reviewIntro"){
    renderReviewIntro();
  } else if(saved.screen === "end"){
    renderEnd();
  } else {
    renderStart();
  }
}

init();
</script>
